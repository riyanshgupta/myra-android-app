        const icon = playBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.textContent = isPlaying ? 'pause' : 'play_arrow';

          if (liked) {
            icon.style.fontVariationSettings = "'FILL' 1";
            likeBtn.className = 'w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center text-tertiary shadow-md active:scale-95 transition-transform';
