<script>
  (function initSearchMicroInteractions() {
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-btn');
    const voiceBtn = document.getElementById('voice-ai-btn');
    const promptChips = document.querySelectorAll('.ai-prompt-chip');
    const clearAllRecents = document.getElementById('clear-all-recents');
    const recentChipsContainer = document.getElementById('recent-chips-container');
    const recentSection = document.getElementById('recent-searches-section');

    if (input && clearBtn) {
      input.addEventListener('input', (e) => {
        if (e.target.value.trim().length > 0) {
          clearBtn.classList.remove('hidden');
          clearBtn.classList.add('flex');
        } else {
          clearBtn.classList.remove('flex');
          clearBtn.classList.add('hidden');
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.classList.remove('flex');
        clearBtn.classList.add('hidden');
        input.focus();
      });
    }

    if (promptChips && input) {
      promptChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const prompt = chip.getAttribute('data-prompt');
          if (prompt) {
            input.value = prompt.replace(/[^\w\s-]/gi, '').trim();
            clearBtn.classList.remove('hidden');
            clearBtn.classList.add('flex');
            input.focus();
          }
        });
      });
    }

    if (recentChipsContainer) {
      recentChipsContainer.addEventListener('click', (e) => {
        const removeBtn = e.target.closest('.remove-chip');
        if (removeBtn) {
          const pill = removeBtn.parentElement;
          if (pill) {
            pill.remove();
            if (recentChipsContainer.children.length === 0 && recentSection) {
              recentSection.style.display = 'none';
            }
          }
        }
      });
    }

    if (clearAllRecents && recentSection) {
      clearAllRecents.addEventListener('click', () => {
        recentSection.style.display = 'none';
      });
    }

    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        if (input) {
          input.setAttribute('placeholder', 'Listening for your drive mood...');
          voiceBtn.classList.add('scale-110');
          setTimeout(() => {
            input.setAttribute('placeholder', 'Songs, moods, or ask Myra...');
            voiceBtn.classList.remove('scale-110');
          }, 3200);
        }
      });
    }
  })();
